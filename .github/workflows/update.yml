name: Update feeds

on:
  schedule:
    # 毎日 07:00 JST(= 22:00 UTC 前日)
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # Actionsタブから手動実行も可能
  push:
    branches: [main]
    paths: ["feeds.yaml", "fetch.py", "build.py"]

permissions:
  contents: write   # data/items.json をコミットするため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch feeds
        run: python fetch.py

      - name: Build site
        run: python build.py

      - name: Commit data
        run: |
          git config user.name "feed-hub-bot"
          git config user.email "feed-hub-bot@users.noreply.github.com"
          git add data/items.json
          git diff --cached --quiet || git commit -m "chore: update feed data"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
